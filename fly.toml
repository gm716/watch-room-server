app = "watch-room-server-gm716" # ⚠️ 必须改成全球唯一的名称，比如加上你的名字缩写和数字
primary_region = "hkg" # 香港节点，离国内近

[build]

[env]
  PORT = "3001"
  NODE_ENV = "production"
  AUTH_KEY = "aB3x9K2mP8qR4tY6wE7vN1sD5fG0hJ2L" # ⚠️ 填入我之前给你生成的密钥

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false # 观影室需要保持长连接，千万别让它休眠
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
